<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family:Arial; }
svg { width:100vw; height:90vh; background:#f5f5f5; }

.box {
  fill:#f4a261;
  rx:8;
  stroke:black;
}

.text {
  font-size:12px;
  text-anchor:middle;
  fill:white;
}

.line {
  stroke:black;
  stroke-width:2;
  fill:none;
}
</style>
</head>

<body>

<svg></svg>

<script>

const svg = d3.select("svg");
const g = svg.append("g");

const boxW = 80;
const boxH = 30;
const gapX = 40;
const gapY = 100;

// veri
const data = {
  name:"Ata",
  spouse:"Eş",
  children:[
    {
      name:"Ahmet",
      spouse:"Eş",
      children:[
        {name:"Ali"},
        {name:"Ayşe"}
      ]
    },
    {
      name:"Mehmet",
      spouse:"Eş",
      children:[
        {name:"Hasan"},
        {name:"Zeynep"}
      ]
    }
  ]
};

// node genişliği hesap
function getWidth(node){
  if(!node.children) return boxW;

  let total = 0;
  node.children.forEach(c=>{
    total += getWidth(c) + gapX;
  });

  return Math.max(boxW*2, total);
}

// çizim
function draw(node, x, y){

  const center = x;

  // ana kişi
  g.append("rect")
    .attr("class","box")
    .attr("x", center - boxW - 5)
    .attr("y", y)
    .attr("width", boxW)
    .attr("height", boxH);

  g.append("text")
    .attr("class","text")
    .attr("x", center - boxW/2 - 5)
    .attr("y", y + 20)
    .text(node.name);

  // eş
  if(node.spouse){
    g.append("rect")
      .attr("class","box")
      .attr("x", center + 5)
      .attr("y", y)
      .attr("width", boxW)
      .attr("height", boxH);

    g.append("text")
      .attr("class","text")
      .attr("x", center + boxW/2 + 5)
      .attr("y", y + 20)
      .text(node.spouse);

    // eş çizgisi
    g.append("line")
      .attr("class","line")
      .attr("x1", center - 5)
      .attr("x2", center + 5)
      .attr("y1", y + boxH/2)
      .attr("y2", y + boxH/2);
  }

  // çocuklar
  if(node.children){

    const totalWidth = getWidth(node);
    let startX = center - totalWidth/2;

    // aşağı çizgi
    g.append("line")
      .attr("class","line")
      .attr("x1", center)
      .attr("x2", center)
      .attr("y1", y + boxH)
      .attr("y2", y + gapY/2);

    // yatay çizgi
    g.append("line")
      .attr("class","line")
      .attr("x1", startX)
      .attr("x2", startX + totalWidth)
      .attr("y1", y + gapY/2)
      .attr("y2", y + gapY/2);

    node.children.forEach(child=>{

      const childWidth = getWidth(child);
      const childCenter = startX + childWidth/2;

      // aşağı bağlantı
      g.append("line")
        .attr("class","line")
        .attr("x1", childCenter)
        .attr("x2", childCenter)
        .attr("y1", y + gapY/2)
        .attr("y2", y + gapY);

      draw(child, childCenter, y + gapY);

      startX += childWidth + gapX;
    });
  }
}

draw(data, window.innerWidth/2, 50);

</script>

</body>
</html>
