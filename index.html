<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
}

#tree {
  margin-top: 40px;
}

.person {
  display: inline-block;
  padding: 10px 15px;
  margin: 10px;
  border: 2px solid black;
  border-radius: 10px;
  cursor: pointer;
  background: white;
}

.selected {
  background: yellow;
}

.controls {
  margin-top: 20px;
}
</style>
</head>

<body>

<h2>Soyağacı</h2>

<div id="tree"></div>

<div class="controls">
  <input id="nameInput" placeholder="İsim gir">
  <br><br>
  <button onclick="addChild()">Çocuk Ekle</button>
  <button onclick="addParent()">Ebeveyn Ekle</button>
  <button onclick="addSpouse()">Eş Ekle</button>
  <button onclick="updateName()">İsmi Güncelle</button>
</div>

<script>
// ====== STATE ======
let tree = [];
let selectedPersonId = null;

// ====== KİŞİ OLUŞTUR ======
function createPerson(name) {
  return {
    id: Date.now() + Math.random(),
    name,
    children: [],
    parents: [],
    spouse: null
  };
}

// ====== BUL ======
function findPerson(id) {
  return tree.find(p => p.id === id);
}

// ====== SEÇ ======
function selectPerson(id) {
  selectedPersonId = id;
  renderTree();
}

// ====== ÇOCUK EKLE ======
function addChild() {
  const name = document.getElementById("nameInput").value;
  if (!selectedPersonId || !name) return;

  const parent = findPerson(selectedPersonId);
  const child = createPerson(name);

  parent.children.push(child.id);
  child.parents.push(parent.id);

  if (parent.spouse) {
    const spouse = findPerson(parent.spouse);
    spouse.children.push(child.id);
    child.parents.push(spouse.id);
  }

  tree.push(child);
  renderTree();
}

// ====== EBEVEYN EKLE ======
function addParent() {
  const name = document.getElementById("nameInput").value;
  if (!selectedPersonId || !name) return;

  const child = findPerson(selectedPersonId);
  const parent = createPerson(name);

  parent.children.push(child.id);
  child.parents.push(parent.id);

  tree.push(parent);
  renderTree();
}

// ====== EŞ EKLE ======
function addSpouse() {
  const name = document.getElementById("nameInput").value;
  if (!selectedPersonId || !name) return;

  const person = findPerson(selectedPersonId);
  if (person.spouse) return alert("Zaten eşi var");

  const spouse = createPerson(name);

  person.spouse = spouse.id;
  spouse.spouse = person.id;

  tree.push(spouse);
  renderTree();
}

// ====== İSİM GÜNCELLE ======
function updateName() {
  const name = document.getElementById("nameInput").value;
  if (!selectedPersonId || !name) return;

  const person = findPerson(selectedPersonId);
  person.name = name;

  renderTree();
}

// ====== AĞACI ÇİZ ======
function renderTree() {
  const container = document.getElementById("tree");
  container.innerHTML = "";

  // sadece en üst ataları bul
  const roots = tree.filter(p => p.parents.length === 0);

  roots.forEach(root => {
    container.appendChild(drawPerson(root));
  });
}

// ====== RECURSIVE ÇİZİM ======
function drawPerson(person) {
  const div = document.createElement("div");

  div.className = "person";
  if (person.id === selectedPersonId) {
    div.classList.add("selected");
  }

  div.innerText = person.name;
  div.onclick = () => selectPerson(person.id);

  const wrapper = document.createElement("div");
  wrapper.appendChild(div);

  // eş göster
  if (person.spouse) {
    const spouse = findPerson(person.spouse);
    if (spouse) {
      const spouseDiv = document.createElement("div");
      spouseDiv.className = "person";
      spouseDiv.innerText = "❤️ " + spouse.name;
      spouseDiv.onclick = () => selectPerson(spouse.id);
      wrapper.appendChild(spouseDiv);
    }
  }

  // çocuklar
  if (person.children.length > 0) {
    const childrenDiv = document.createElement("div");

    person.children.forEach(childId => {
      const child = findPerson(childId);
      childrenDiv.appendChild(drawPerson(child));
    });

    wrapper.appendChild(childrenDiv);
  }

  return wrapper;
}

// ====== BAŞLANGIÇ ======
const root = createPerson("Ata");
tree.push(root);
renderTree();

</script>

</body>
</html>
