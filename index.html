<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO+</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family: Arial; }

svg {
  width:100vw;
  height:85vh;
  background:#f5f5f5;
}

.node rect {
  fill:white;
  stroke:black;
  stroke-width:2px;
  rx:6;
}

.node text {
  font-size:12px;
  text-anchor:middle;
}

.link {
  fill:none;
  stroke:black;
  stroke-width:2px;
}

.modal {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
}

input, textarea {
  width:100%;
  margin-top:10px;
}

button {
  margin-top:10px;
  width:100%;
}
</style>
</head>

<body>

<h3 style="text-align:center;">🌳 Soyağacı PRO+</h3>
<svg></svg>

<div class="modal" id="modal">
  <div class="modal-content">
    <input id="nameInput">
    <textarea id="noteInput"></textarea>
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk Ekle</button>
    <button onclick="addSpouse()">Eş Ekle</button>
    <button onclick="addParent()">Ebeveyn Ekle</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

function createId(){
  return Date.now() + Math.random();
}

// 🔥 TÜM NODE'LAR
let people = {};

function createPerson(name){
  const id = createId();
  people[id] = {
    id,
    name,
    note:"",
    spouseId:null,
    children:[]
  };
  return people[id];
}

let root = createPerson("Ata");

let selectedNode = null;

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom", (e)=>{
  g.attr("transform", e.transform);
}));

// 🔥 AĞAÇ OLUŞTURMA (eşleri de dahil ediyor)
function buildTree(node, visited = new Set()){

  if(visited.has(node.id)) return null;
  visited.add(node.id);

  let children = [];

  // normal çocuklar
  node.children.forEach(id=>{
    const child = buildTree(people[id], visited);
    if(child) children.push(child);
  });

  // eşi de aynı seviyeye ekle
  if(node.spouseId){
    const spouse = people[node.spouseId];
    if(spouse && !visited.has(spouse.id)){
      visited.add(spouse.id);
      children.push({
        ...spouse,
        children:[]
      });
    }
  }

  return {
    ...node,
    children
  };
}

function getTextWidth(text){
  return text.length * 7 + 20;
}

function updateTree(){

  g.selectAll("*").remove();

  const treeData = d3.hierarchy(buildTree(root));

  const treeLayout = d3.tree().nodeSize([180,200]);
  treeLayout(treeData);

  // çizgiler
  g.selectAll(".link")
    .data(treeData.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d", d=>`
      M${d.source.x},${d.source.y}
      V${(d.source.y + d.target.y)/2}
      H${d.target.x}
      V${d.target.y}
    `);

  // node
  const nodes = g.selectAll(".node")
    .data(treeData.descendants())
    .enter()
    .append("g")
    .attr("class","node")
    .attr("transform", d=>`translate(${d.x},${d.y})`);

  nodes.each(function(d){

    const node = d.data;
    const gNode = d3.select(this);

    const width = getTextWidth(node.name);

    gNode.append("rect")
      .attr("x",-width/2)
      .attr("y",-15)
      .attr("width",width)
      .attr("height",30)
      .on("click",(e)=>{
        selectedNode = node;
        openModal(node);
        e.stopPropagation();
      });

    gNode.append("text")
      .attr("dy",4)
      .text(node.name);

  });

}

function openModal(person){
  document.getElementById("nameInput").value = person.name;
  document.getElementById("noteInput").value = person.note || "";
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function save(){
  selectedNode.name = document.getElementById("nameInput").value;
  selectedNode.note = document.getElementById("noteInput").value;
  updateTree();
  closeModal();
}

function addChild(){
  const child = createPerson("Yeni Kişi");
  selectedNode.children.push(child.id);
  updateTree();
}

function addSpouse(){

  if(selectedNode.spouseId){
    alert("Zaten eşi var");
    return;
  }

  const spouse = createPerson("Eş");

  selectedNode.spouseId = spouse.id;
  spouse.spouseId = selectedNode.id;

  updateTree();
}

function addParent(){

  const parent = createPerson("Yeni Ebeveyn");
  parent.children.push(selectedNode.id);

  if(root.id === selectedNode.id){
    root = parent;
  } else {

    function replace(node){
      node.children = node.children.map(id=>{
        if(id === selectedNode.id){
          return parent.id;
        }
        replace(people[id]);
        return id;
      });
    }

    replace(root);
  }

  updateTree();
  closeModal();
}

updateTree();

</script>

</body>
</html>
