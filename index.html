<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO+</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family: Arial; }
svg { width:100vw; height:85vh; background:#f5f5f5; }
.node rect { fill:white; stroke:black; stroke-width:2px; rx:6; }
.node text { font-size:12px; text-anchor:middle; }
.link { fill:none; stroke:black; stroke-width:2px; }
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; }
.modal-content { background:white; padding:20px; border-radius:10px; width:300px; }
input, textarea { width:100%; margin-top:10px; }
button { margin-top:10px; width:100%; }
</style>
</head>

<body>

<h3 style="text-align:center;">🌳 Soyağacı PRO+</h3>
<svg></svg>

<div class="modal" id="modal">
  <div class="modal-content">
    <input id="nameInput">
    <textarea id="noteInput"></textarea>
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk Ekle</button>
    <button onclick="addSpouse()">Eş Ekle</button>
    <button onclick="addParent()">Ebeveyn Ekle</button>
    <button onclick="deletePerson()">Sil</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

function createId(){
  return Date.now() + Math.random();
}

let data = JSON.parse(localStorage.getItem("treeData")) || {
  id:createId(),
  name:"Ata",
  children:[]
};

let selectedNode = null;

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom", (e)=>{
  g.attr("transform", e.transform);
}));

function saveTree(){
  localStorage.setItem("treeData", JSON.stringify(data));
}

function getTextWidth(text){
  return text.length * 7 + 20;
}

function updateTree(){

  g.selectAll("*").remove();

  const root = d3.hierarchy(data);
  const treeLayout = d3.tree().nodeSize([180,200]);
  treeLayout(root);

  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d", d=>`
      M${d.source.x},${d.source.y}
      V${(d.source.y + d.target.y)/2}
      H${d.target.x}
      V${d.target.y}
    `);

  const nodes = g.selectAll(".node")
    .data(root.descendants())
    .enter()
    .append("g")
    .attr("class","node")
    .attr("transform", d=>`translate(${d.x},${d.y})`);

  nodes.append("rect")
    .attr("x",-40)
    .attr("y",-15)
    .attr("width",80)
    .attr("height",30)
    .on("click",(e,d)=>{
      selectedNode = d.data;
      openModal(d.data);
      e.stopPropagation();
    });

  nodes.append("text")
    .attr("dy",4)
    .text(d=>d.data.name);

}

function openModal(person){
  document.getElementById("nameInput").value = person.name;
  document.getElementById("noteInput").value = person.note || "";
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function save(){
  selectedNode.name = document.getElementById("nameInput").value;
  saveTree();
  updateTree();
  closeModal();
}

function addChild(){
  if(!selectedNode.children) selectedNode.children = [];
  selectedNode.children.push({
    id:createId(),
    name:"Yeni Kişi",
    children:[]
  });
  saveTree();
  updateTree();
}

// 🔥 EŞ ARTIK GERÇEK NODE
function addSpouse(){

  if(selectedNode.spouseId){
    alert("Zaten eşi var");
    return;
  }

  const spouse = {
    id:createId(),
    name:"Eş",
    children:[]
  };

  // aynı parent'a ekle
  function insert(node){
    if(node.children){
      node.children = node.children.flatMap(c=>{
        if(c.id === selectedNode.id){
          return [c, spouse];
        }
        insert(c);
        return c;
      });
    }
  }

  if(data.id === selectedNode.id){
    data = {
      id:createId(),
      name:"Root",
      children:[data, spouse]
    };
  } else {
    insert(data);
  }

  saveTree();
  updateTree();
}

// 🔥 ARTIK %100 DOĞRU
function addParent(){

  function insert(node){

    if(!node.children) return;

    node.children = node.children.map(c=>{

      if(c.id === selectedNode.id){

        return {
          id:createId(),
          name:"Yeni Ebeveyn",
          children:[c]
        };

      }

      insert(c);
      return c;

    });
  }

  if(data.id === selectedNode.id){
    data = {
      id:createId(),
      name:"Yeni Ebeveyn",
      children:[data]
    };
  } else {
    insert(data);
  }

  saveTree();
  updateTree();
  closeModal();
}

function deletePerson(){}

updateTree();

</script>

</body>
</html>
