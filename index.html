<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı FIXED</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family: Arial; }

svg {
  width:100vw;
  height:85vh;
  background:#f5f5f5;
}

.node rect {
  fill:white;
  stroke:black;
  stroke-width:2px;
  rx:6;
}

.node text {
  font-size:12px;
  text-anchor:middle;
}

.link {
  fill:none;
  stroke:black;
  stroke-width:2px;
}

.modal {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
}

input, textarea {
  width:100%;
  margin-top:10px;
}

button {
  margin-top:10px;
  width:100%;
}
</style>
</head>

<body>

<h3 style="text-align:center;">🌳 Soyağacı</h3>

<svg></svg>

<div class="modal" id="modal">
  <div class="modal-content">
    <input id="nameInput">
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk Ekle</button>
    <button onclick="addSpouse()">Eş Ekle</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

let data = {
  name:"Ata",
  children:[
    { name:"Ahmet", children:[{name:"Ali"},{name:"Ayşe"}]},
    { name:"Mehmet", children:[{name:"Hasan"},{name:"Zeynep"}]}
  ]
};

let selectedNode = null;

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom", (e)=>{
  g.attr("transform", e.transform);
}));

// 🔥 TEK ÇOCUK FIX
function normalize(node){
  if(node.children && node.children.length === 1){
    node.children.push({name:"", ghost:true});
  }
  if(node.children){
    node.children.forEach(normalize);
  }
}

function updateTree(){

  g.selectAll("*").remove();

  const clone = JSON.parse(JSON.stringify(data));
  normalize(clone);

  const root = d3.hierarchy(clone);
  const treeLayout = d3.tree().nodeSize([90,150]);
  treeLayout(root);

  // 🔥 LİNKLER
  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d", d=>`
      M${d.source.x},${d.source.y}
      V${(d.source.y + d.target.y)/2}
      H${d.target.x}
      V${d.target.y}
    `);

  const nodes = g.selectAll(".node")
    .data(root.descendants().filter(d=>!d.data.ghost))
    .enter()
    .append("g")
    .attr("class","node")
    .attr("transform", d=>`translate(${d.x},${d.y})`);

  // ANA NODE
  nodes.append("rect")
    .attr("x",-30)
    .attr("y",-15)
    .attr("width",60)
    .attr("height",30);

  nodes.append("text")
    .attr("dy",4)
    .text(d=>d.data.name);

  // 🔥 EŞ DÜZGÜN ÇİZİM
  nodes.each(function(d){

    if(d.data.spouse){

      const offset = 80;

      // eş kutu
      d3.select(this)
        .append("rect")
        .attr("x",offset-30)
        .attr("y",-15)
        .attr("width",60)
        .attr("height",30);

      d3.select(this)
        .append("text")
        .attr("x",offset)
        .attr("dy",4)
        .text(d.data.spouse.name);

      // eş çizgi
      d3.select(this)
        .append("line")
        .attr("x1",30)
        .attr("x2",offset-30)
        .attr("y1",0)
        .attr("y2",0)
        .attr("stroke","black");

      // 🔥 ÇOCUK BAĞLANTI NOKTASI ORTALAMA
      d.x = d.x + offset/2;
    }

  });

  nodes.on("click",(e,d)=>{
    selectedNode = d.data;
    document.getElementById("nameInput").value = d.data.name;
    document.getElementById("modal").style.display="flex";
  });

}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function save(){
  selectedNode.name = document.getElementById("nameInput").value;
  closeModal();
  updateTree();
}

function addChild(){
  if(!selectedNode.children){
    selectedNode.children = [];
  }
  selectedNode.children.push({ name:"Yeni" });
  updateTree();
}

function addSpouse(){
  selectedNode.spouse = { name:"Eş" };
  updateTree();
}

updateTree();

</script>

</body>
</html>
