<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı</title>

<style>
body {
  font-family: Arial;
  text-align: center;
}

/* TREE */
.tree ul {
  padding-top: 20px;
  position: relative;
  display: flex;
  justify-content: center;
}

.tree li {
  list-style-type: none;
  text-align: center;
  position: relative;
  padding: 20px 10px 0 10px;
}

/* ÇİZGİLER */
.tree li::before, .tree li::after {
  content: '';
  position: absolute;
  top: 0;
  right: 50%;
  border-top: 2px solid black;
  width: 50%;
  height: 20px;
}

.tree li::after {
  right: auto;
  left: 50%;
  border-left: 2px solid black;
}

.tree li:only-child::before,
.tree li:only-child::after {
  display: none;
}

/* NODE */
.node {
  border: 2px solid black;
  padding: 6px 10px;
  display: inline-block;
  border-radius: 6px;
  cursor: pointer;
  background: white;
}

/* NOT ALANI */
textarea {
  margin-top: 20px;
  width: 250px;
  height: 100px;
}
</style>
</head>

<body>

<h2>🌳 Soyağacı</h2>

<div class="tree" id="tree"></div>

<h3>Not</h3>
<textarea id="note" placeholder="Not yaz..."></textarea>

<script>
const treeData = [
{
  name: "Ata",
  children: [
    {
      name: "Ahmet",
      children: [
        { name: "Ali", children: [{name:"Ali Çocuk1"}, {name:"Ali Çocuk2"}] },
        { name: "Ayşe", children: [{name:"Ayşe Çocuk1"}, {name:"Ayşe Çocuk2"}] },
        { name: "Mehmet", children: [{name:"Mehmet Çocuk1"}] }
      ]
    },
    {
      name: "Mehmet",
      children: [
        { name: "Hasan", children: [{name:"Hasan Çocuk1"}, {name:"Hasan Çocuk2"}] },
        { name: "Hüseyin", children: [{name:"Hüseyin Çocuk1"}] },
        { name: "Zeynep", children: [{name:"Zeynep Çocuk1"}, {name:"Zeynep Çocuk2"}] }
      ]
    },
    {
      name: "Fatma",
      children: [
        { name: "Elif", children: [{name:"Elif Çocuk1"}, {name:"Elif Çocuk2"}] },
        { name: "Ece", children: [{name:"Ece Çocuk1"}, {name:"Ece Çocuk2"}] }
      ]
    }
  ]
}
];

const treeDiv = document.getElementById("tree");
const note = document.getElementById("note");

let current = "";

function createNode(person) {
  const li = document.createElement("li");

  const div = document.createElement("div");
  div.className = "node";
  div.innerText = person.name;

  div.onclick = () => {
    current = person.name;
    note.value = localStorage.getItem(current) || "";
  };

  li.appendChild(div);

  if (person.children) {
    const ul = document.createElement("ul");

    person.children.forEach(child => {
      ul.appendChild(createNode(child));
    });

    li.appendChild(ul);
  }

  return li;
}

const ul = document.createElement("ul");
ul.appendChild(createNode(treeData[0]));
treeDiv.appendChild(ul);

note.oninput = () => {
  if(current) {
    localStorage.setItem(current, note.value);
  }
};
</script>

</body>
</html>
