<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Soyağacı PRO+ (Gelişmiş Soy Bağlantısı)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin:0; font-family: 'Segoe UI', sans-serif; background:#f0f2f5; }
        svg { width:100vw; height:100vh; }
        .node rect { fill:white; stroke:#2c3e50; stroke-width:2px; rx:5; }
        .node text { font-size:12px; text-anchor:middle; font-weight:500; pointer-events:none; }
        .link { fill:none; stroke:#999; stroke-width:1.5px; }
        .marriage-link { fill:none; stroke:#e91e63; stroke-width:2px; stroke-dasharray: 5,3; }
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:99; }
        .modal-content { background:white; padding:20px; border-radius:10px; width:300px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        button { width:100%; margin-top:8px; padding:8px; cursor:pointer; border-radius:5px; border:none; font-weight:bold; }
        .btn-add { background:#3498db; color:white; }
        .btn-save { background:#27ae60; color:white; }
        .btn-del { background:#e74c3c; color:white; }
        input, textarea { width:100%; margin-top:5px; padding:5px; box-sizing:border-box; }
    </style>
</head>
<body>

<div style="position:fixed; top:10px; width:100%; text-align:center; pointer-events:none;">
    <h2 style="margin:0; color:#2c3e50;">🌳 Soyağacı Sistemi</h2>
    <p style="margin:0; font-size:12px;">Eşlere ebeveyn ekleyerek her iki soyu da büyütebilirsiniz.</p>
</div>

<svg id="tree-svg"></svg>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="m-title" style="margin:0 0 10px 0;">Düzenle</h3>
        <input id="nameInput" placeholder="İsim">
        <textarea id="noteInput" placeholder="Notlar" rows="2"></textarea>
        <button class="btn-save" onclick="save()">Kaydet</button>
        <button class="btn-add" onclick="addChild()">Çocuk Ekle</button>
        <button class="btn-add" onclick="addSpouse()">Eş Ekle</button>
        <button class="btn-add" onclick="addParent()">Ebeveyn Ekle</button>
        <button class="btn-del" onclick="deletePerson()">Sil</button>
        <button style="background:#95a5a6; color:white;" onclick="closeModal()">Kapat</button>
    </div>
</div>

<script>
let treeData = JSON.parse(localStorage.getItem("proTree")) || {
    id: "root",
    name: "Ata",
    children: []
};

let selectedNode = null;
let selectedType = "self";

const svg = d3.select("#tree-svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));

function saveTree() { localStorage.setItem("proTree", JSON.stringify(treeData)); }

function update() {
    g.selectAll("*").remove();

    // Hiyerarşiyi oluştur
    const root = d3.hierarchy(treeData);
    const treeLayout = d3.tree().nodeSize([180, 150]);
    treeLayout(root);

    // Eşler ve Bağlantılar İçin Koordinat Haritası
    const nodes = root.descendants();
    const marriageLinks = [];

    // Normal Linkler (Ebeveyn-Çocuk)
    g.selectAll(".link")
        .data(root.links())
        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", d => `M${d.source.x},${d.source.y}V${(d.source.y+d.target.y)/2}H${d.target.x}V${d.target.y}`);

    // Düğümleri Çiz
    const nodeEnter = g.selectAll(".node")
        .data(nodes)
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.x},${d.y})`);

    nodeEnter.each(function(d) {
        const el = d3.select(this);
        const isSpouseNode = d.data.isSpouseBranch; // Bu bir eş soyu dalı mı?

        // Ana kutu
        el.append("rect")
            .attr("x", -60).attr("y", -15).attr("width", 120).attr("height", 30)
            .attr("fill", isSpouseNode ? "#fff0f5" : "white")
            .attr("stroke", isSpouseNode ? "#e91e63" : "#2c3e50")
            .on("click", (e) => {
                selectedNode = d.data;
                selectedType = "self";
                openModal(d.data);
                e.stopPropagation();
            });

        el.append("text").attr("dy", 5).text(d.data.name);

        // Eğer bu düğümün bir eşi varsa (Klasik görünüm)
        if (d.data.spouse) {
            const spX = 100;
            // Eş kutusu
            el.append("rect")
                .attr("x", spX).attr("y", -15).attr("width", 100).attr("height", 30)
                .attr("fill", "#fff0f5").attr("stroke", "#e91e63")
                .on("click", (e) => {
                    selectedNode = d.data.spouse;
                    selectedNode._parentRef = d.data; // Bağlantı için referans
                    selectedType = "spouse";
                    openModal(d.data.spouse);
                    e.stopPropagation();
                });

            el.append("text").attr("x", spX + 50).attr("dy", 5).text(d.data.spouse.name);

            // Evlilik çizgisi
            el.append("line")
                .attr("class", "marriage-link")
                .attr("x1", 60).attr("y1", 0).attr("x2", spX).attr("y2", 0);
        }
    });
}

function openModal(person) {
    document.getElementById("nameInput").value = person.name;
    document.getElementById("noteInput").value = person.note || "";
    document.getElementById("modal").style.display = "flex";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

function save() {
    selectedNode.name = document.getElementById("nameInput").value;
    selectedNode.note = document.getElementById("noteInput").value;
    saveTree(); closeModal(); update();
}

function addChild() {
    if (!selectedNode.children) selectedNode.children = [];
    selectedNode.children.push({ id: Date.now(), name: "Yeni Çocuk", children: [] });
    saveTree(); update();
}

function addSpouse() {
    if (selectedNode.spouse) return alert("Eş zaten var");
    selectedNode.spouse = { id: Date.now(), name: "Eş", note: "" };
    saveTree(); update();
}

// 🔥 KRİTİK DÜZELTME: Ebeveyn Ekleme
function addParent() {
    if (selectedType === "spouse") {
        // EŞE EBEVEYN EKLEME: 
        // Eşi olduğu yerden silmiyoruz. Sadece ağacın en üstüne eşin soyunu yeni bir dal olarak ekliyoruz.
        const spouseData = selectedNode;
        const newBranch = {
            id: Date.now(),
            name: spouseData.name + " Soyu (Ebeveyn)",
            isSpouseBranch: true,
            children: [ { ...spouseData, isSpouseBranch: true } ] 
        };
        
        // Eşi bir "soy dalı" olarak en tepeye (root seviyesine) kardeş olarak ekle
        // Not: Gerçek bir soy ağacında çoklu root olamayacağı için geçici bir üst düğüm oluşturulur
        if(!treeData.isWrapper) {
            treeData = {
                name: "Aileler",
                isWrapper: true,
                children: [treeData, newBranch]
            };
        } else {
            treeData.children.push(newBranch);
        }
    } else {
        // KENDİNE EBEVEYN EKLEME (Normal akış)
        const findAndReplace = (node) => {
            if (node.children) {
                for (let i = 0; i < node.children.length; i++) {
                    if (node.children[i].id === selectedNode.id) {
                        const oldChild = node.children[i];
                        node.children[i] = { id: Date.now(), name: "Ebeveyn", children: [oldChild] };
                        return true;
                    }
                    if (findAndReplace(node.children[i])) return true;
                }
            }
            return false;
        };

        if (treeData.id === selectedNode.id) {
            treeData = { id: Date.now(), name: "Ebeveyn", children: [treeData] };
        } else {
            findAndReplace(treeData);
        }
    }
    saveTree(); closeModal(); update();
}

function deletePerson() {
    const remove = (node) => {
        if (!node.children) return;
        node.children = node.children.filter(c => c.id !== selectedNode.id);
        node.children.forEach(remove);
    };
    remove(treeData);
    saveTree(); closeModal(); update();
}

update();
</script>
</body>
</html>
