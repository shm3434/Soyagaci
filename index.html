<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO+</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family: Arial; }

svg {
  width:100vw;
  height:85vh;
  background:#f5f5f5;
}

.node rect {
  fill:white;
  stroke:black;
  stroke-width:2px;
  rx:6;
}

.node text {
  font-size:12px;
  text-anchor:middle;
}

.link {
  fill:none;
  stroke:black;
  stroke-width:2px;
}

.modal {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
}

input, textarea {
  width:100%;
  margin-top:10px;
}

button {
  margin-top:10px;
  width:100%;
}
</style>
</head>

<body>

<h3 style="text-align:center;">🌳 Soyağacı PRO+</h3>

<svg></svg>

<div class="modal" id="modal">
  <div class="modal-content">
    <input id="nameInput">
    <textarea id="noteInput"></textarea>
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk Ekle</button>
    <button onclick="addSpouse()">Eş Ekle</button>
    <button onclick="addParent()">Ebeveyn Ekle</button>
    <button onclick="deletePerson()">Sil</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

function createId(){
  return Date.now() + Math.random();
}

let data = JSON.parse(localStorage.getItem("treeData")) || {
  id:createId(),
  name:"Ata",
  note:"",
  spouse:null,
  children:[]
};

let selectedNode = null;
let selectedType = "self";

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom", (e)=>{
  g.attr("transform", e.transform);
}));

function saveTree(){
  localStorage.setItem("treeData", JSON.stringify(data));
}

function getTextWidth(text){
  return text.length * 7 + 20;
}

function getMaxChildren(node){
  let max = node.children ? node.children.length : 0;
  if(node.children){
    node.children.forEach(c=>{
      max = Math.max(max, getMaxChildren(c));
    });
  }
  return max;
}

function updateTree(){

  g.selectAll("*").remove();

  const root = d3.hierarchy(data);

  const maxChildren = getMaxChildren(data);
  const dynamicSpacing = Math.max(150, maxChildren * 70);

  const treeLayout = d3.tree().nodeSize([dynamicSpacing,200]);
  treeLayout(root);

  root.descendants().forEach(d=>{
    if(d.children && d.children.length){
      const avg = d3.mean(d.children, c => c.x);
      d.x = avg;
    }
  });

  root.descendants().forEach(d=>{

    const gap = 60;

    const mainWidth = getTextWidth(d.data.name);
    const spouseWidth = d.data.spouse ? getTextWidth(d.data.spouse.name) : 0;

    d.mainWidth = mainWidth;
    d.spouseWidth = spouseWidth;

    if(d.data.spouse){
      d.totalWidth = mainWidth + gap + spouseWidth;
    } else {
      d.totalWidth = mainWidth;
    }

    d.realX = d.x - d.totalWidth/2;

    d.linkX = d.realX + (d.mainWidth / 2);

    if(d.data.spouse){
      d.childCenterX = d.realX + d.mainWidth + (gap / 2);
    } else {
      d.childCenterX = d.realX + (d.mainWidth / 2);
    }

  });

  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d", d=>`
      M${d.source.childCenterX},${d.source.y}
      V${(d.source.y + d.target.y)/2}
      H${d.target.linkX}
      V${d.target.y}
    `);

  const nodes = g.selectAll(".node")
    .data(root.descendants())
    .enter()
    .append("g")
    .attr("class","node")
    .attr("transform", d=>`translate(${d.realX},${d.y})`);

  nodes.each(function(d){

    const gNode = d3.select(this);
    const gap = 60;

    gNode.append("rect")
      .attr("x",0)
      .attr("y",-15)
      .attr("width",d.mainWidth)
      .attr("height",30)
      .on("click",(e)=>{
        selectedNode = d.data;
        selectedType = "self";
        openModal(d.data);
        e.stopPropagation();
      });

    gNode.append("text")
      .attr("x",d.mainWidth/2)
      .attr("dy",4)
      .text(d.data.name);

    if(d.data.spouse){

      const startX = d.mainWidth + gap;

      gNode.append("rect")
        .attr("x",startX)
        .attr("y",-15)
        .attr("width",d.spouseWidth)
        .attr("height",30)
        .attr("fill","#ffe6e6")
        .on("click",(e)=>{
          selectedNode = d.data.spouse;
          selectedType = "spouse";
          openModal(d.data.spouse);
          e.stopPropagation();
        });

      gNode.append("text")
        .attr("x",startX + d.spouseWidth/2)
        .attr("dy",4)
        .text(d.data.spouse.name);

      gNode.append("line")
        .attr("x1", d.mainWidth)
        .attr("x2", startX)
        .attr("y1",0)
        .attr("y2",0)
        .attr("stroke","black")
        .attr("stroke-width",2);
    }

  });

}

// 🔥 SADECE BU FONKSİYON DEĞİŞTİ
function addParent(){

  function insertParent(node){

    if(!node.children) return;

    node.children = node.children.map(c=>{

      if(selectedType === "self" && c.id === selectedNode.id){

        return {
          id:createId(),
          name:"Yeni Ebeveyn",
          note:"",
          spouse:null,
          children:[c]
        };

      }

      if(selectedType === "spouse" && c.spouse && c.spouse.id === selectedNode.id){

        const oldSpouse = c.spouse;
        c.spouse = null;

        return {
          id:createId(),
          name:"Yeni Ebeveyn",
          note:"",
          spouse:null,
          children:[oldSpouse]
        };

      }

      insertParent(c);
      return c;

    });
  }

  if(selectedType === "self" && data.id === selectedNode.id){

    data = {
      id:createId(),
      name:"Yeni Ebeveyn",
      note:"",
      spouse:null,
      children:[data]
    };

  } else {

    insertParent(data);
  }

  saveTree();
  closeModal();
  updateTree();
}

function openModal(person){
  document.getElementById("nameInput").value = person.name;
  document.getElementById("noteInput").value = person.note || "";
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function save(){

  const name = document.getElementById("nameInput").value;
  const note = document.getElementById("noteInput").value;

  selectedNode.name = name;
  selectedNode.note = note;

  saveTree();
  closeModal();
  updateTree();
}

function addChild(){

  if(!selectedNode.children){
    selectedNode.children = [];
  }

  selectedNode.children.push({
    id:createId(),
    name:"Yeni Kişi",
    note:"",
    spouse:null,
    children:[]
  });

  saveTree();
  updateTree();
}

function addSpouse(){

  if(selectedNode.spouse){
    alert("Zaten eşi var");
    return;
  }

  selectedNode.spouse = {
    id:createId(),
    name:"Eş",
    note:""
  };

  saveTree();
  updateTree();
}

function deletePerson(){

  if(!confirm("Silmek istediğine emin misin?")) return;

  if(data === selectedNode){
    alert("Ata silinemez");
    return;
  }

  function removeNode(parent){
    if(!parent.children) return;

    parent.children = parent.children.filter(c => c !== selectedNode);
    parent.children.forEach(child => removeNode(child));
  }

  removeNode(data);

  saveTree();
  closeModal();
  updateTree();
}

updateTree();

</script>

</body>
</html>
