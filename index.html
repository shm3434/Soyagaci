<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO</title>

<style>
body { margin:0; font-family:Arial; }

#tree {
  width:100vw;
  height:85vh;
  overflow:auto;
  position:relative;
  background:#f5f5f5;
}

.node {
  position:absolute;
  border:2px solid black;
  padding:6px 10px;
  border-radius:6px;
  background:white;
  cursor:pointer;
}

/* POPUP */
.modal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.box {
  background:white;
  padding:20px;
  width:300px;
}

button { margin-top:10px; width:100%; }
</style>
</head>

<body>

<div id="tree"></div>

<div class="modal" id="modal">
  <div class="box">
    <input id="nameInput">
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk ekle</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

let data = {
  name:"Ata",
  children:[
    {name:"Ahmet", children:[{name:"Ali"},{name:"Ayşe"}]},
    {name:"Mehmet", children:[{name:"Hasan"},{name:"Zeynep"}]},
    {name:"Fatma", children:[{name:"Elif"},{name:"Ece"}]}
  ]
};

let selected=null;

function draw(node,x,y,level=0){
  const div=document.createElement("div");
  div.className="node";
  div.innerText=node.name;
  div.style.left=x+"px";
  div.style.top=y+"px";

  div.onclick=()=>{
    selected=node;
    document.getElementById("nameInput").value=node.name;
    document.getElementById("modal").style.display="flex";
  };

  document.getElementById("tree").appendChild(div);

  if(node.children){
    let startX=x-((node.children.length-1)*100)/2;

    node.children.forEach((c,i)=>{
      draw(c,startX+i*100,y+100,level+1);
    });
  }
}

function render(){
  document.getElementById("tree").innerHTML="";
  draw(data,window.innerWidth/2,50);
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function save(){
  selected.name=document.getElementById("nameInput").value;
  closeModal();
  render();
}

function addChild(){
  if(!selected.children) selected.children=[];
  selected.children.push({name:"Yeni"});
  closeModal();
  render();
}

render();

</script>

</body>
</html>
