<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO+</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family: Arial; }

svg {
  width:100vw;
  height:85vh;
  background:#f5f5f5;
}

.node rect {
  fill:white;
  stroke:black;
  stroke-width:2px;
  rx:6;
}

.node text {
  font-size:12px;
  text-anchor:middle;
}

.link {
  fill:none;
  stroke:black;
  stroke-width:2px;
}

.modal {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
}

input, textarea {
  width:100%;
  margin-top:10px;
}

button {
  margin-top:10px;
  width:100%;
}
</style>
</head>

<body>

<h3 style="text-align:center;">🌳 Soyağacı PRO+</h3>

<svg></svg>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Kişi</h3>
    <input id="nameInput">
    <textarea id="noteInput"></textarea>
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk Ekle</button>
    <button onclick="addSpouse()">Eş Ekle</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

// ===== ID =====
function createId(){
  return Date.now() + Math.random();
}

// ===== DATA =====
let data = JSON.parse(localStorage.getItem("treeData")) || {
  id:createId(),
  name:"Ata",
  note:"",
  spouse:null,
  children:[]
};

let selectedNode = null;
let selectedType = "self"; // self / spouse

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom", (e)=>{
  g.attr("transform", e.transform);
}));

// ===== SAVE =====
function saveTree(){
  localStorage.setItem("treeData", JSON.stringify(data));
}

// ===== TREE =====
function updateTree(){

  g.selectAll("*").remove();

  const root = d3.hierarchy(data);
  const treeLayout = d3.tree().nodeSize([100,150]);
  treeLayout(root);

  // LINKS (ÖZEL - ORTADAN)
  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d", d=>{

      let sourceX = d.source.x;

      // eş varsa ortadan çıkar
      if(d.source.data.spouse){
        sourceX = d.source.x + 30;
      }

      return `
        M${sourceX},${d.source.y}
        V${(d.source.y + d.target.y)/2}
        H${d.target.x}
        V${d.target.y}
      `;
    });

  // NODES
  const nodes = g.selectAll(".node")
    .data(root.descendants())
    .enter()
    .append("g")
    .attr("class","node")
    .attr("transform", d=>`translate(${d.x},${d.y})`);

  // ANA KİŞİ
  nodes.append("rect")
    .attr("x",-30)
    .attr("y",-15)
    .attr("width",60)
    .attr("height",30)
    .on("click",(e,d)=>{
      selectedNode = d.data;
      selectedType = "self";
      openModal(d.data);
      e.stopPropagation();
    });

  nodes.append("text")
    .attr("dy",4)
    .text(d=>d.data.name);

  // EŞ
  nodes.each(function(d){

    if(d.data.spouse){

      const gNode = d3.select(this);

      gNode.append("rect")
        .attr("x",30)
        .attr("y",-15)
        .attr("width",60)
        .attr("height",30)
        .attr("fill","#ffe6e6")
        .on("click",(e)=>{
          selectedNode = d.data;
          selectedType = "spouse";
          openModal(d.data.spouse);
          e.stopPropagation();
        });

      gNode.append("text")
        .attr("x",60)
        .attr("dy",4)
        .text(d.data.spouse.name);
    }

  });

}

// ===== MODAL =====
function openModal(person){
  document.getElementById("nameInput").value = person.name;
  document.getElementById("noteInput").value = person.note || "";
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

// ===== SAVE =====
function save(){

  const name = document.getElementById("nameInput").value;
  const note = document.getElementById("noteInput").value;

  if(selectedType === "self"){
    selectedNode.name = name;
    selectedNode.note = note;
  } else {
    selectedNode.spouse.name = name;
    selectedNode.spouse.note = note;
  }

  saveTree();
  closeModal();
  updateTree();
}

// ===== CHILD =====
function addChild(){

  if(!selectedNode.children){
    selectedNode.children = [];
  }

  selectedNode.children.push({
    id:createId(),
    name:"Yeni Kişi",
    note:"",
    spouse:null,
    children:[]
  });

  saveTree();
  updateTree();
}

// ===== SPOUSE =====
function addSpouse(){

  if(selectedNode.spouse){
    alert("Zaten eşi var");
    return;
  }

  selectedNode.spouse = {
    id:createId(),
    name:"Eş",
    note:""
  };

  saveTree();
  updateTree();
}

// ===== START =====
updateTree();

</script>

</body>
</html>
