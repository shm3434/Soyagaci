<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı Eşli</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family:Arial; }

svg {
  width:100vw;
  height:85vh;
  background:#f5f5f5;
}

.node rect {
  fill:white;
  stroke:black;
  stroke-width:2px;
  rx:6;
}

.link {
  stroke:black;
  fill:none;
}

.spouse-line {
  stroke:black;
  stroke-width:2px;
}

.modal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.box {
  background:white;
  padding:20px;
  width:300px;
}

button { margin-top:10px; width:100%; }
</style>
</head>

<body>

<svg></svg>

<div class="modal" id="modal">
  <div class="box">
    <input id="nameInput">
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk ekle</button>
    <button onclick="addSpouse()">Eş ekle</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

// YENİ MODEL
let data = {
  name:"Baba",
  spouse:{ name:"Anne" },
  children:[
    { name:"Çocuk1" },
    { name:"Çocuk2" }
  ]
};

let selected = null;

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom",(e)=>{
  g.attr("transform",e.transform);
}));

function buildTree(node){
  let children = node.children || [];
  return {
    name: node.name,
    ref: node,
    children: children.map(buildTree)
  };
}

function update(){

  g.selectAll("*").remove();

  const rootData = buildTree(data);
  const root = d3.hierarchy(rootData);

  const tree = d3.tree().nodeSize([120,150]);
  tree(root);

  // ÇİZGİLER
  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d",d=>`
      M${d.source.x},${d.source.y}
      V${(d.source.y+d.target.y)/2}
      H${d.target.x}
      V${d.target.y}
    `);

  // NODE
  const nodes = g.selectAll(".node")
    .data(root.descendants())
    .enter()
    .append("g")
    .attr("transform",d=>`translate(${d.x},${d.y})`);

  // ANA KİŞİ
  nodes.append("rect")
    .attr("x",-30)
    .attr("y",-15)
    .attr("width",60)
    .attr("height",30);

  nodes.append("text")
    .attr("dy",4)
    .text(d=>d.data.name);

  // EŞ ÇİZ
  nodes.each(function(d){

    const node = d.data.ref;

    if(node.spouse){

      const spouseX = 80;

      // eş kutu
      d3.select(this)
        .append("rect")
        .attr("x",spouseX-30)
        .attr("y",-15)
        .attr("width",60)
        .attr("height",30);

      d3.select(this)
        .append("text")
        .attr("x",spouseX)
        .attr("dy",4)
        .text(node.spouse.name);

      // eş çizgi
      d3.select(this)
        .append("line")
        .attr("class","spouse-line")
        .attr("x1",30)
        .attr("x2",spouseX-30)
        .attr("y1",0)
        .attr("y2",0);
    }

  });

  // TIKLAMA
  nodes.on("click",(e,d)=>{
    selected = d.data.ref;
    document.getElementById("nameInput").value = selected.name;
    document.getElementById("modal").style.display="flex";
  });

}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function save(){
  selected.name = document.getElementById("nameInput").value;
  closeModal();
  update();
}

function addChild(){
  if(!selected.children) selected.children=[];
  selected.children.push({name:"Yeni"});
  closeModal();
  update();
}

function addSpouse(){
  selected.spouse = {name:"Eş"};
  closeModal();
  update();
}

update();

</script>

</body>
</html>
