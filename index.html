<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO+</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family: Arial; }

svg {
  width:100vw;
  height:85vh;
  background:#f5f5f5;
}

.node rect {
  fill:white;
  stroke:black;
  stroke-width:2px;
  rx:6;
}

.node text {
  font-size:12px;
  text-anchor:middle;
}

.link {
  fill:none;
  stroke:black;
  stroke-width:2px;
}

.modal {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
}

input, textarea {
  width:100%;
  margin-top:10px;
}

button {
  margin-top:10px;
  width:100%;
}
</style>
</head>

<body>

<h3 style="text-align:center;">🌳 Soyağacı PRO+</h3>
<svg></svg>

<div class="modal" id="modal">
  <div class="modal-content">
    <input id="nameInput">
    <textarea id="noteInput"></textarea>
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk Ekle</button>
    <button onclick="addSpouse()">Eş Ekle</button>
    <button onclick="addParent()">Ebeveyn Ekle</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

// 🔥 GLOBAL NODE MAP (bağımsız node sistemi)
let nodes = {};

function createId(){
  return Date.now() + Math.random();
}

function createNode(name){
  const id = createId();
  nodes[id] = {
    id,
    name,
    note:"",
    spouseId:null,
    children:[]
  };
  return nodes[id];
}

// ROOT
let data = createNode("Ata");

let selectedNode = null;
let selectedType = "self";

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom", (e)=>{
  g.attr("transform", e.transform);
}));

function getTextWidth(text){
  return text.length * 7 + 20;
}

// 🔥 TREE BUILDER (senin görünümü koruyor)
function buildTree(node){

  return {
    ...node,
    children: node.children.map(id => buildTree(nodes[id]))
  };
}

function updateTree(){

  g.selectAll("*").remove();

  const root = d3.hierarchy(buildTree(data));

  const treeLayout = d3.tree().nodeSize([150,200]);
  treeLayout(root);

  // linkler
  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d", d=>`
      M${d.source.x},${d.source.y}
      V${(d.source.y + d.target.y)/2}
      H${d.target.x}
      V${d.target.y}
    `);

  const nodesDraw = g.selectAll(".node")
    .data(root.descendants())
    .enter()
    .append("g")
    .attr("class","node")
    .attr("transform", d=>`translate(${d.x},${d.y})`);

  nodesDraw.each(function(d){

    const node = nodes[d.data.id];
    const gNode = d3.select(this);
    const gap = 60;

    const mainWidth = getTextWidth(node.name);

    // ANA KUTU
    gNode.append("rect")
      .attr("x",-mainWidth/2)
      .attr("y",-15)
      .attr("width",mainWidth)
      .attr("height",30)
      .on("click",(e)=>{
        selectedNode = node;
        selectedType = "self";
        openModal(node);
        e.stopPropagation();
      });

    gNode.append("text")
      .attr("dy",4)
      .text(node.name);

    // 🔥 EŞ ÇİZİMİ (ama bağımsız node)
    if(node.spouseId){

      const spouse = nodes[node.spouseId];
      const spouseWidth = getTextWidth(spouse.name);

      const startX = mainWidth/2 + gap;

      gNode.append("rect")
        .attr("x",startX)
        .attr("y",-15)
        .attr("width",spouseWidth)
        .attr("height",30)
        .attr("fill","#ffe6e6")
        .on("click",(e)=>{
          selectedNode = spouse;
          selectedType = "spouse";
          openModal(spouse);
          e.stopPropagation();
        });

      gNode.append("text")
        .attr("x",startX + spouseWidth/2)
        .attr("dy",4)
        .text(spouse.name);

      gNode.append("line")
        .attr("x1", mainWidth/2)
        .attr("x2", startX)
        .attr("y1",0)
        .attr("y2",0)
        .attr("stroke","black");
    }

  });

}

function openModal(person){
  document.getElementById("nameInput").value = person.name;
  document.getElementById("noteInput").value = person.note || "";
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function save(){
  selectedNode.name = document.getElementById("nameInput").value;
  selectedNode.note = document.getElementById("noteInput").value;
  updateTree();
  closeModal();
}

// 🔥 ÇOCUK
function addChild(){
  const child = createNode("Yeni Kişi");
  selectedNode.children.push(child.id);
  updateTree();
}

// 🔥 EŞ (GERÇEK NODE)
function addSpouse(){

  if(selectedNode.spouseId){
    alert("Zaten eşi var");
    return;
  }

  const spouse = createNode("Eş");

  selectedNode.spouseId = spouse.id;
  spouse.spouseId = selectedNode.id;

  updateTree();
}

// 🔥 EBEVEYN (ARTIK %100 DOĞRU)
function addParent(){

  const parent = createNode("Yeni Ebeveyn");
  parent.children.push(selectedNode.id);

  if(data.id === selectedNode.id){
    data = parent;
  } else {

    function replace(node){
      node.children = node.children.map(id=>{
        if(id === selectedNode.id){
          return parent.id;
        }
        replace(nodes[id]);
        return id;
      });
    }

    replace(data);
  }

  updateTree();
  closeModal();
}

updateTree();

</script>

</body>
</html>
