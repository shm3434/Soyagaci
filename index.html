<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO++</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family:Arial; }

svg { width:100vw; height:85vh; background:#f5f5f5; }

.node rect {
  fill:white;
  stroke:black;
  stroke-width:2px;
  rx:6;
}

.link { stroke:black; fill:none; }

.modal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box {
  background:white;
  padding:20px;
  width:300px;
}

button { margin-top:5px; width:100%; }
</style>
</head>

<body>

<svg></svg>

<div class="modal" id="modal">
  <div class="modal-box">
    <input id="nameInput" placeholder="İsim">
    <button onclick="save()">Kaydet</button>
    <button onclick="addChild()">Çocuk ekle</button>
    <button onclick="addSpouse()">Eş ekle</button>
    <button onclick="addParent()">Ebeveyn ekle</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>

let data = {
  name:"Ata",
  children:[],
  spouses:[]
};

let selectedNode=null;

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom",(e)=>{
  g.attr("transform",e.transform);
}));

function normalize(node){
  if(node.children && node.children.length===1){
    node.children.push({name:"", ghost:true});
  }
  if(node.children){
    node.children.forEach(normalize);
  }
}

function update(){

  g.selectAll("*").remove();

  const clone = JSON.parse(JSON.stringify(data));
  normalize(clone);

  const root = d3.hierarchy(clone);
  const tree = d3.tree().nodeSize([100,150]);
  tree(root);

  // LINK
  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d",d=>`
      M${d.source.x},${d.source.y}
      V${(d.source.y+d.target.y)/2}
      H${d.target.x}
      V${d.target.y}
    `);

  // NODE
  const nodes = g.selectAll(".node")
    .data(root.descendants().filter(d=>!d.data.ghost))
    .enter()
    .append("g")
    .attr("class","node")
    .attr("transform",d=>`translate(${d.x},${d.y})`);

  nodes.append("rect")
    .attr("x",-30)
    .attr("y",-15)
    .attr("width",60)
    .attr("height",30);

  nodes.append("text")
    .attr("dy",4)
    .text(d=>d.data.name);

  nodes.on("click",(e,d)=>{
    selectedNode = findNode(data,d.data.name);

    document.getElementById("nameInput").value = selectedNode.name;

    document.getElementById("modal").style.display="flex";
  });

}

function findNode(node,name){
  if(node.name===name) return node;
  if(node.children){
    for(let c of node.children){
      let found = findNode(c,name);
      if(found) return found;
    }
  }
  return null;
}

function save(){
  selectedNode.name = document.getElementById("nameInput").value;
  closeModal();
  update();
}

function addChild(){
  if(!selectedNode.children) selectedNode.children=[];
  selectedNode.children.push({name:"Yeni"});
  update();
}

function addSpouse(){
  if(!selectedNode.spouses) selectedNode.spouses=[];
  selectedNode.spouses.push({name:"Eş"});
  alert("Eş eklendi (yakında çizime yansıtılacak)");
}

function addParent(){
  alert("Ebeveyn sistemi bir sonraki adımda görselleştirilecek");
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

update();

</script>

</body>
</html>
