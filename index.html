<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
}

svg {
  width: 100vw;
  height: 90vh;
  background: #f5f5f5;
}

/* NODE KUTU */
.node rect {
  fill: white;
  stroke: black;
  stroke-width: 2px;
  rx: 6;
}

.node text {
  font-size: 12px;
  text-anchor: middle;
  pointer-events: none;
}

/* DÜZ ÇİZGİ */
.link {
  fill: none;
  stroke: black;
  stroke-width: 2px;
}

textarea {
  width: 100%;
  height: 100px;
}
</style>
</head>

<body>

<h3 style="text-align:center;">🌳 Soyağacı</h3>

<svg></svg>

<textarea id="note" placeholder="Not yaz..."></textarea>

<script>

const data = {
  name: "Ata",
  children: [
    {
      name: "Ahmet",
      children: [
        { name: "Ali", children: [{name:"Ali1"}, {name:"Ali2"}] },
        { name: "Ayşe", children: [{name:"Ayşe1"}, {name:"Ayşe2"}] }
      ]
    },
    {
      name: "Mehmet",
      children: [
        { name: "Hasan", children: [{name:"Hasan1"}, {name:"Hasan2"}] },
        { name: "Zeynep", children: [{name:"Zeynep1"}, {name:"Zeynep2"}] }
      ]
    }
  ]
};

const svg = d3.select("svg");
const g = svg.append("g");

// ZOOM
svg.call(
  d3.zoom().on("zoom", (event) => {
    g.attr("transform", event.transform);
  })
);

// TREE (YATAY)
const treeLayout = d3.tree().nodeSize([80, 150]);
const root = d3.hierarchy(data);

treeLayout(root);

// DÜZ LİNK (KESKİN ÇİZGİ)
g.selectAll(".link")
  .data(root.links())
  .enter()
  .append("path")
  .attr("class", "link")
  .attr("d", d => `
    M${d.source.x},${d.source.y}
    V${(d.source.y + d.target.y) / 2}
    H${d.target.x}
    V${d.target.y}
  `);

// NODE
const nodes = g.selectAll(".node")
  .data(root.descendants())
  .enter()
  .append("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${d.x},${d.y})`);

nodes.append("rect")
  .attr("x", -30)
  .attr("y", -15)
  .attr("width", 60)
  .attr("height", 30);

nodes.append("text")
  .attr("dy", 4)
  .text(d => d.data.name);

// NOT
let current = "";
const note = document.getElementById("note");

nodes.on("click", (event, d) => {
  current = d.data.name;
  note.value = localStorage.getItem(current) || "";
});

note.oninput = () => {
  if(current) {
    localStorage.setItem(current, note.value);
  }
};

</script>

</body>
</html>
