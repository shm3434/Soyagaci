<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
}

svg {
  width: 100vw;
  height: 90vh;
  background: #f5f5f5;
}

/* NODE */
.node circle {
  fill: white;
  stroke: black;
  stroke-width: 2px;
}

.node text {
  font-size: 12px;
  text-anchor: middle;
  pointer-events: none;
}

/* LINK */
.link {
  fill: none;
  stroke: #555;
  stroke-width: 2px;
}

textarea {
  width: 100%;
  height: 100px;
}
</style>
</head>

<body>

<h3 style="text-align:center;">🌳 Soyağacı (Zoom + Drag)</h3>

<svg></svg>

<textarea id="note" placeholder="Seçili kişi için not yaz..."></textarea>

<script>

// VERİ
const data = {
  name: "Ata",
  children: [
    {
      name: "Ahmet",
      children: [
        { name: "Ali", children: [{name:"Ali1"}, {name:"Ali2"}] },
        { name: "Ayşe", children: [{name:"Ayşe1"}, {name:"Ayşe2"}] }
      ]
    },
    {
      name: "Mehmet",
      children: [
        { name: "Hasan", children: [{name:"Hasan1"}, {name:"Hasan2"}] },
        { name: "Zeynep", children: [{name:"Zeynep1"}, {name:"Zeynep2"}] }
      ]
    }
  ]
};

const svg = d3.select("svg");
const width = window.innerWidth;
const height = window.innerHeight;

const g = svg.append("g");

// ZOOM
svg.call(
  d3.zoom().on("zoom", (event) => {
    g.attr("transform", event.transform);
  })
);

// TREE
const treeLayout = d3.tree().size([width, height - 100]);
const root = d3.hierarchy(data);

treeLayout(root);

// LINKLER
g.selectAll(".link")
  .data(root.links())
  .enter()
  .append("path")
  .attr("class", "link")
  .attr("d", d3.linkVertical()
    .x(d => d.x)
    .y(d => d.y)
  );

// NODE
const nodes = g.selectAll(".node")
  .data(root.descendants())
  .enter()
  .append("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${d.x},${d.y})`);

nodes.append("circle")
  .attr("r", 15);

nodes.append("text")
  .attr("dy", 4)
  .text(d => d.data.name);

// NOT SİSTEMİ
let current = "";
const note = document.getElementById("note");

nodes.on("click", (event, d) => {
  current = d.data.name;
  note.value = localStorage.getItem(current) || "";
});

note.oninput = () => {
  if(current) {
    localStorage.setItem(current, note.value);
  }
};

</script>

</body>
</html>
