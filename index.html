<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
}

#tree {
  margin-top: 40px;
}

.person {
  padding: 10px 15px;
  border: 2px solid black;
  border-radius: 10px;
  cursor: pointer;
  background: white;
  min-width: 60px;
  text-align: center;
}

.selected {
  background: yellow;
}

.row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 10px 0;
}

.children {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 10px;
}

.controls {
  margin-top: 20px;
}
</style>
</head>

<body>

<h2>Soyağacı</h2>

<div id="tree"></div>

<div class="controls">
  <input id="nameInput" placeholder="İsim gir">
  <br><br>
  <button onclick="addChild()">Çocuk Ekle</button>
  <button onclick="addParent()">Ebeveyn Ekle</button>
  <button onclick="addSpouse()">Eş Ekle</button>
  <button onclick="updateName()">İsmi Güncelle</button>
  <button onclick="resetTree()">Sıfırla</button>
</div>

<script>
// ===== STATE =====
let tree = [];
let selectedPersonId = null;

// ===== KAYDET =====
function saveTree() {
  localStorage.setItem("familyTree", JSON.stringify(tree));
}

// ===== YÜKLE =====
function loadTree() {
  const data = localStorage.getItem("familyTree");

  if (data) {
    tree = JSON.parse(data);
  } else {
    const root = createPerson("Ata");
    tree.push(root);
  }
}

// ===== KİŞİ =====
function createPerson(name) {
  return {
    id: Date.now() + Math.random(),
    name,
    children: [],
    parents: [],
    spouse: null
  };
}

function findPerson(id) {
  return tree.find(p => p.id === id);
}

// ===== SEÇ =====
function selectPerson(id) {
  selectedPersonId = id;
  renderTree();
}

// ===== ÇOCUK =====
function addChild() {
  const name = document.getElementById("nameInput").value;
  if (!selectedPersonId || !name) return;

  const parent = findPerson(selectedPersonId);
  const child = createPerson(name);

  parent.children.push(child.id);
  child.parents.push(parent.id);

  if (parent.spouse) {
    const spouse = findPerson(parent.spouse);
    spouse.children.push(child.id);
    child.parents.push(spouse.id);
  }

  tree.push(child);
  renderTree();
}

// ===== EBEVEYN =====
function addParent() {
  const name = document.getElementById("nameInput").value;
  if (!selectedPersonId || !name) return;

  const child = findPerson(selectedPersonId);
  const parent = createPerson(name);

  parent.children.push(child.id);
  child.parents.push(parent.id);

  tree.push(parent);
  renderTree();
}

// ===== EŞ =====
function addSpouse() {
  const name = document.getElementById("nameInput").value;
  if (!selectedPersonId || !name) return;

  const person = findPerson(selectedPersonId);
  if (person.spouse) return alert("Zaten eşi var");

  const spouse = createPerson(name);

  person.spouse = spouse.id;
  spouse.spouse = person.id;

  tree.push(spouse);
  renderTree();
}

// ===== İSİM =====
function updateName() {
  const name = document.getElementById("nameInput").value;
  if (!selectedPersonId || !name) return;

  const person = findPerson(selectedPersonId);
  person.name = name;

  renderTree();
}

// ===== SIFIRLA =====
function resetTree() {
  localStorage.removeItem("familyTree");
  location.reload();
}

// ===== ÇİZ =====
function renderTree() {
  const container = document.getElementById("tree");
  container.innerHTML = "";

  const roots = tree.filter(p => p.parents.length === 0);

  roots.forEach(root => {
    container.appendChild(drawPerson(root));
  });

  saveTree(); // 🔥 otomatik kayıt
}

// ===== ÇİZİM =====
function drawPerson(person) {
  const wrapper = document.createElement("div");

  const row = document.createElement("div");
  row.className = "row";

  const personDiv = document.createElement("div");
  personDiv.className = "person";

  if (person.id === selectedPersonId) {
    personDiv.classList.add("selected");
  }

  personDiv.innerText = person.name;
  personDiv.onclick = () => selectPerson(person.id);

  row.appendChild(personDiv);

  if (person.spouse) {
    const spouse = findPerson(person.spouse);
    if (spouse) {
      const spouseDiv = document.createElement("div");
      spouseDiv.className = "person";
      spouseDiv.innerText = "❤️ " + spouse.name;
      spouseDiv.onclick = () => selectPerson(spouse.id);

      row.appendChild(spouseDiv);
    }
  }

  wrapper.appendChild(row);

  if (person.children.length > 0) {
    const childrenDiv = document.createElement("div");
    childrenDiv.className = "children";

    person.children.forEach(childId => {
      const child = findPerson(childId);
      childrenDiv.appendChild(drawPerson(child));
    });

    wrapper.appendChild(childrenDiv);
  }

  return wrapper;
}

// ===== BAŞLAT =====
loadTree();
renderTree();

</script>

</body>
</html>
