<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı PRO+</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial; background: #f0f0f0; }
h3 { text-align: center; margin: 8px 0; font-size: 16px; }

#toolbar { text-align: center; margin-bottom: 4px; }
#toolbar button {
  margin: 0 4px; padding: 4px 12px;
  border-radius: 4px; border: 1px solid #aaa;
  background: white; cursor: pointer;
}

svg {
  display: block;
  width: 100vw;
  height: calc(100vh - 60px);
  background: #f5f5f5;
}

.link { fill: none; stroke: #555; stroke-width: 2px; }
.node-rect { stroke-width: 2px; cursor: pointer; }

.node-text {
  font-size: 12px;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}
</style>
</head>

<body>

<h3>🌳 Soyağacı PRO+</h3>
<div id="toolbar">
  <button onclick="resetTree()">🔄 Sıfırla</button>
</div>

<svg id="mainSvg"></svg>

<script>

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function newPerson(name = "Yeni Kişi") {
  return {
    id: uid(),
    name,
    children: [],
    spouse: null,
    spouseTree: null
  };
}

let data = newPerson("Ata");

// ---- Layout sabitleri ----
const BOX_H = 30;
const BOX_PAD = 16;
const COUPLE_GAP = 40;
const NODE_GAP = 24;
const LEVEL_H = 110;

function bw(node) {
  return Math.max(60, node.name.length * 7 + BOX_PAD * 2);
}

function cw(node) {
  if (!node.spouse) return bw(node);
  return bw(node) + COUPLE_GAP + bw(node.spouse);
}

function subtreeWidth(node) {
  if (!node.children.length) return cw(node);

  const w = node.children.reduce((s,c)=>s+subtreeWidth(c),0)
    + (node.children.length-1)*NODE_GAP;

  return Math.max(cw(node), w);
}

function assignPositions(node, left, depth) {
  const w = subtreeWidth(node);
  node._cx = left + w/2;
  node._y = depth * LEVEL_H;

  let cur = node._cx - w/2;

  node.children.forEach(c=>{
    const cw2 = subtreeWidth(c);
    assignPositions(c, cur, depth+1);
    cur += cw2 + NODE_GAP;
  });
}

function draw() {
  const svg = d3.select("#mainSvg");
  svg.selectAll("*").remove();

  const g = svg.append("g");

  assignPositions(data,0,0);
  drawNode(g,data);
}

function drawNode(g,node) {
  const cx=node._cx;
  const y=node._y;

  const mw=bw(node);
  const sw=node.spouse?bw(node.spouse):0;

  const total=cw(node);
  const lx=cx-total/2;

  drawBox(g,lx,y-BOX_H/2,mw,node);

  if(node.spouse){
    const sx=lx+mw+COUPLE_GAP;

    g.append("line").attr("class","link")
      .attr("x1",lx+mw).attr("y1",y)
      .attr("x2",sx).attr("y2",y);

    drawBox(g,sx,y-BOX_H/2,sw,node.spouse);

    if(node.spouseTree){
      drawSpouseAncestors(g,node.spouseTree,sx+sw/2,y);
    }
  }

  node.children.forEach(c=>drawNode(g,c));
}

// 🔥 DÜZELTİLMİŞ FONKSİYON
function drawSpouseAncestors(g, treeNode, childCenterX, childY) {

  const nodeY = childY - LEVEL_H;
  const nmw = bw(treeNode);

  const nodeCX = childCenterX;

  drawBox(g, nodeCX - nmw/2, nodeY - BOX_H/2, nmw, treeNode);

  if (treeNode.children.length > 0) {

    function localWidth(n){
      if(!n.children.length) return cw(n);

      return Math.max(
        cw(n),
        n.children.reduce((s,c)=>s+localWidth(c),0)
        + (n.children.length-1)*NODE_GAP
      );
    }

    const total = treeNode.children.reduce((s,c)=>s+localWidth(c),0)
      + (treeNode.children.length-1)*NODE_GAP;

    let cur = nodeCX - total/2;

    treeNode.children.forEach(child=>{

      const w = localWidth(child);
      const cx = cur + w/2;

      child._cx = cx;
      child._y = nodeY + LEVEL_H;

      g.append("line")
        .attr("class","link")
        .attr("x1",nodeCX)
        .attr("y1",nodeY+BOX_H/2)
        .attr("x2",cx)
        .attr("y2",child._y-BOX_H/2);

      drawNode(g,child);

      cur += w + NODE_GAP;
    });
  }
}

function drawBox(g,x,y,w,node){
  g.append("rect")
    .attr("x",x)
    .attr("y",y)
    .attr("width",w)
    .attr("height",BOX_H)
    .attr("fill","white")
    .attr("stroke","#444");

  g.append("text")
    .attr("x",x+w/2)
    .attr("y",y+BOX_H/2)
    .text(node.name)
    .attr("class","node-text");
}

function resetTree(){
  data=newPerson("Ata");
  draw();
}

draw();

</script>
</body>
</html>
