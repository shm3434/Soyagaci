<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Soyağacı PRO+ Final</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#f4f7f6; overflow: hidden; }
        svg { width:100vw; height:100vh; }
        .node rect { fill:#fff; stroke:#333; stroke-width:2px; rx:5; cursor: pointer; }
        .node text { font-size:13px; text-anchor:middle; pointer-events:none; font-weight: bold; }
        .link { fill:none; stroke:#ccc; stroke-width:2px; }
        .spouse-link { fill:none; stroke:#ff4081; stroke-width:2px; stroke-dasharray: 5,5; }
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; z-index:100; }
        .modal-content { background:#fff; padding:20px; border-radius:8px; width:320px; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
        input, textarea { width:100%; margin-bottom:10px; padding:8px; box-sizing:border-box; border:1px solid #ddd; border-radius:4px; }
        button { width:100%; padding:10px; margin-bottom:5px; cursor:pointer; border:none; border-radius:4px; font-weight:bold; transition: 0.2s; }
        .btn-primary { background:#2196f3; color:#fff; }
        .btn-success { background:#4caf50; color:#fff; }
        .btn-danger { background:#f44336; color:#fff; }
        .btn-close { background:#9e9e9e; color:#fff; }
        button:hover { opacity:0.8; }
    </style>
</head>
<body>

<div style="position:absolute; width:100%; text-align:center; top:10px; pointer-events:none;">
    <h2>🌳 Dinamik Soyağacı</h2>
    <p>Düzenlemek için kutulara tıklayın.</p>
</div>

<svg id="tree-canvas"></svg>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3 style="margin-top:0">Kişi Ayarları</h3>
        <input type="text" id="nameInput" placeholder="İsim">
        <textarea id="noteInput" placeholder="Notlar..."></textarea>
        <button class="btn-success" onclick="save()">💾 Kaydet</button>
        <button class="btn-primary" onclick="addChild()">👶 Çocuk Ekle</button>
        <button class="btn-primary" onclick="addSpouse()">💍 Eş Ekle</button>
        <button class="btn-primary" onclick="addParent()">⬆️ Ebeveyn Ekle</button>
        <button class="btn-danger" onclick="deletePerson()">🗑️ Sil</button>
        <button class="btn-close" onclick="closeModal()">❌ Kapat</button>
    </div>
</div>

<script>
// --- VERİ YAPISI ---
let treeData = JSON.parse(localStorage.getItem("familyTreeV3")) || {
    id: "root_" + Date.now(),
    name: "Ata",
    children: [],
    spouse: null
};

let selectedNode = null;
let selectedType = "self"; // "self" veya "spouse"

const svg = d3.select("#tree-canvas");
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.1, 3]).on("zoom", (e) => g.attr("transform", e.transform)));

function saveToLocal() { localStorage.setItem("familyTreeV3", JSON.stringify(treeData)); }

// --- ÇİZİM ---
function update() {
    g.selectAll("*").remove();

    const root = d3.hierarchy(treeData);
    const treeLayout = d3.tree().nodeSize([200, 150]);
    treeLayout(root);

    // 1. Linkler (Ebeveyn -> Çocuk)
    g.selectAll(".link")
        .data(root.links())
        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", d => `M${d.source.x},${d.source.y}V${(d.source.y + d.target.y)/2}H${d.target.x}V${d.target.y}`);

    // 2. Düğümler
    const nodes = g.selectAll(".node")
        .data(root.descendants())
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.x},${d.y})`);

    nodes.each(function(d) {
        const nodeGroup = d3.select(this);
        
        // Ana Kutucuk
        nodeGroup.append("rect")
            .attr("x", -60).attr("y", -20).attr("width", 120).attr("height", 40)
            .on("click", (e) => {
                selectedNode = d.data;
                selectedType = "self";
                openModal(d.data);
                e.stopPropagation();
            });
        
        nodeGroup.append("text").attr("dy", 5).text(d.data.name);

        // Eş Kutucuğu (Varsa)
        if (d.data.spouse) {
            const spX = 100;
            nodeGroup.append("line")
                .attr("class", "spouse-link")
                .attr("x1", 60).attr("y1", 0).attr("x2", spX).attr("y2", 0);

            nodeGroup.append("rect")
                .attr("x", spX).attr("y", -20).attr("width", 100).attr("height", 40)
                .attr("fill", "#fff0f5")
                .attr("stroke", "#ff4081")
                .on("click", (e) => {
                    selectedNode = d.data.spouse;
                    selectedType = "spouse";
                    openModal(d.data.spouse);
                    e.stopPropagation();
                });

            nodeGroup.append("text").attr("x", spX + 50).attr("dy", 5).text(d.data.spouse.name);
        }
    });
}

// --- AKSİYONLAR ---
function openModal(person) {
    document.getElementById("nameInput").value = person.name;
    document.getElementById("noteInput").value = person.note || "";
    document.getElementById("modal").style.display = "flex";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

function save() {
    selectedNode.name = document.getElementById("nameInput").value;
    selectedNode.note = document.getElementById("noteInput").value;
    saveToLocal(); closeModal(); update();
}

function addChild() {
    if (selectedType === "spouse") return alert("Çocuğu lütfen ana kişi üzerinden ekleyin.");
    if (!selectedNode.children) selectedNode.children = [];
    selectedNode.children.push({ id: "id_" + Date.now(), name: "Yeni Çocuk", children: [], spouse: null });
    saveToLocal(); update();
}

function addSpouse() {
    if (selectedNode.spouse || selectedType === "spouse") return alert("Eş zaten var.");
    selectedNode.spouse = { id: "id_" + Date.now(), name: "Eş", children: [], note: "" };
    saveToLocal(); update();
}

function addParent() {
    function findAndInsert(node) {
        if (!node.children) return false;
        for (let i = 0; i < node.children.length; i++) {
            let child = node.children[i];
            
            // Seçili olan ana kişi mi?
            if (selectedType === "self" && child.id === selectedNode.id) {
                node.children[i] = { id: "p_"+Date.now(), name: "Ebeveyn", children: [child] };
                return true;
            }
            
            // Seçili olan bir eş mi? (Eşi hiyerarşide yukarı taşır)
            if (selectedType === "spouse" && child.spouse && child.spouse.id === selectedNode.id) {
                const spouseData = child.spouse;
                child.spouse = null; // Eski yerinden kaldır
                node.children.push({ id: "p_"+Date.now(), name: "Eşin Soyu", children: [spouseData] });
                return true;
            }
            
            if (findAndInsert(child)) return true;
        }
        return false;
    }

    if (selectedType === "self" && treeData.id === selectedNode.id) {
        treeData = { id: "p_"+Date.now(), name: "Yeni Üst Soy", children: [treeData] };
    } else {
        findAndInsert(treeData);
    }
    
    saveToLocal(); closeModal(); update();
}

function deletePerson() {
    if (selectedNode.id === treeData.id) return alert("Ana kök silinemez.");
    if (!confirm("Silinsin mi?")) return;

    function removeRecursive(parent) {
        if (!parent.children) return;
        parent.children = parent.children.filter(c => c.id !== selectedNode.id);
        parent.children.forEach(removeRecursive);
    }

    removeRecursive(treeData);
    saveToLocal(); closeModal(); update();
}

update();
</script>
</body>
</html>
