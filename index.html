<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Soyağacı STABLE</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { margin:0; font-family:Arial; }

svg { width:100vw; height:85vh; background:#f5f5f5; }

.node rect {
  fill:white;
  stroke:black;
  stroke-width:2px;
  rx:6;
}

.link { stroke:black; fill:none; }

.modal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box {
  background:white;
  padding:20px;
  width:300px;
}

button { margin-top:8px; width:100%; }
</style>
</head>

<body>

<svg></svg>

<!-- POPUP 1 -->
<div class="modal" id="modal1">
  <div class="modal-box">
    <h3>Kişi</h3>
    <input id="nameInput">
    <button onclick="save()">Kaydet</button>
    <button onclick="openAddMenu()">Kişi ekle</button>
    <button onclick="closeModal()">Kapat</button>
  </div>
</div>

<!-- POPUP 2 -->
<div class="modal" id="modal2">
  <div class="modal-box">
    <h3>Kişi ekle</h3>
    <button onclick="addChild()">Çocuk ekle</button>
    <button onclick="disabledFeature()">Eş ekle</button>
    <button onclick="disabledFeature()">Ebeveyn ekle</button>
    <button onclick="closeAddMenu()">Geri</button>
  </div>
</div>

<script>

// STABİL VERİ
let data = {
  name:"Ata",
  children:[
    {
      name:"Ahmet",
      children:[
        {name:"Ali"},
        {name:"Ayşe"}
      ]
    },
    {
      name:"Mehmet",
      children:[
        {name:"Hasan"},
        {name:"Zeynep"}
      ]
    },
    {
      name:"Fatma",
      children:[
        {name:"Elif"},
        {name:"Ece"}
      ]
    }
  ]
};

let selectedNode=null;

const svg = d3.select("svg");
const g = svg.append("g");

svg.call(d3.zoom().on("zoom",(e)=>{
  g.attr("transform",e.transform);
}));

// TEK ÇOCUK DÜZELTME
function normalize(node){
  if(node.children && node.children.length===1){
    node.children.push({name:"", ghost:true});
  }
  if(node.children){
    node.children.forEach(normalize);
  }
}

function update(){

  g.selectAll("*").remove();

  const clone = JSON.parse(JSON.stringify(data));
  normalize(clone);

  const root = d3.hierarchy(clone);
  const tree = d3.tree().nodeSize([100,150]);
  tree(root);

  // LINK
  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class","link")
    .attr("d",d=>`
      M${d.source.x},${d.source.y}
      V${(d.source.y+d.target.y)/2}
      H${d.target.x}
      V${d.target.y}
    `);

  // NODE
  const nodes = g.selectAll(".node")
    .data(root.descendants().filter(d=>!d.data.ghost))
    .enter()
    .append("g")
    .attr("class","node")
    .attr("transform",d=>`translate(${d.x},${d.y})`);

  nodes.append("rect")
    .attr("x",-30)
    .attr("y",-15)
    .attr("width",60)
    .attr("height",30);

  nodes.append("text")
    .attr("dy",4)
    .text(d=>d.data.name);

  nodes.on("click",(e,d)=>{
    selectedNode = findNode(data,d.data.name);
    document.getElementById("nameInput").value = selectedNode.name;
    document.getElementById("modal1").style.display="flex";
  });

}

function findNode(node,name){
  if(node.name===name) return node;
  if(node.children){
    for(let c of node.children){
      let f = findNode(c,name);
      if(f) return f;
    }
  }
  return null;
}

// POPUP
function closeModal(){
  document.getElementById("modal1").style.display="none";
}

function openAddMenu(){
  document.getElementById("modal1").style.display="none";
  document.getElementById("modal2").style.display="flex";
}
